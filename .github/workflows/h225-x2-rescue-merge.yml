name: H225-X2 rescue merge
on:
  push:
    branches: [research-work]
    paths:
      - '.github/workflows/h225-x2-rescue-merge.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy
      - name: Download all completed X2 shards from authoritative run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Mikayilzade/loto-research
          run-id: 32693907822
          pattern: h225-x2-s*-c*
          path: h225_x2_download
          merge-multiple: false
      - name: Audit shard completeness before merge
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          ps=sorted(Path('h225_x2_download').rglob('sector_*_chunk_*.json'))
          assert len(ps)==44, len(ps)
          keys=[]; total=0
          for p in ps:
            d=json.loads(p.read_text())
            assert d['packet']=='H241'
            keys.append((d['sector_index'],d['chunk_index']))
            total += d['chunk_quotient_states']
          assert sorted(keys)==[(s,c) for s in range(11) for c in range(4)]
          assert total==306450, total
          print('H225_X2_SHARD_AUDIT_OK',total)
          PY
      - name: Merge and validate exact X2 certificate
        run: |
          PYTHONPATH=src python -m loto_research.h241_h240_incremental_exact_rescreen --merge-dir h225_x2_download
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('data/derived/h241_h240_incremental_exact_rescreen.json')
          d=json.loads(p.read_text())
          assert d['packet']=='H241'
          assert d['chunk_shards']==44
          assert d['quotient_coefficient_states_screened']==306450
          assert len(d['sectors'])==11
          assert sum(s['quotient_coefficient_states'] for s in d['sectors'])==306450
          assert d['exact_shift_surviving_coefficient_states']==295293
          assert d['exact_surviving_shift_tuples']==65921861
          assert p.stat().st_size>100000
          print('H225_X2_MERGED_OK',295293,65921861,'BYTES',p.stat().st_size)
          PY
          cp data/derived/h241_h240_incremental_exact_rescreen.json /tmp/h225_x2_merged.json
          sha256sum /tmp/h225_x2_merged.json
          wc -c /tmp/h225_x2_merged.json
      - name: Force-publish full certificate onto latest research-work
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin research-work
          git reset --hard origin/research-work
          target=data/derived/h241_h240_incremental_exact_rescreen.json
          git update-index --no-skip-worktree "$target" || true
          git update-index --no-assume-unchanged "$target" || true
          cp /tmp/h225_x2_merged.json "$target"
          echo TARGET_BYTES=$(wc -c < "$target")
          echo TARGET_HASH=$(git hash-object "$target")
          git status --short "$target" || true
          git diff --numstat -- "$target" || true
          git add -f "$target"
          git diff --cached --stat
          git diff --cached --quiet && { echo 'ERROR: full certificate did not stage'; exit 2; }
          git commit -m "H225-X2 publish full exact rescreen certificate"
          git pull --rebase origin research-work
          git push origin HEAD:research-work
