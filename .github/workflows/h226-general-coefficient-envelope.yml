name: H226 exact general coefficient-envelope prescreen
on:
  push:
    branches: [research-work]
    paths:
      - 'src/loto_research/h226_general_coefficient_envelope_prescreen.py'
      - '.github/workflows/h226-general-coefficient-envelope.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: research-work}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy scipy
      - run: PYTHONPATH=src python -m loto_research.h226_general_coefficient_envelope_prescreen
      - name: Commit exact result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/derived/h226_general_coefficient_envelope.json
          git commit -m "H226 exact general coefficient-envelope result" || exit 0
          git pull --rebase origin research-work
          git push origin HEAD:research-work
