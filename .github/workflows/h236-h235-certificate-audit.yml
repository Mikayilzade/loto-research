name: H236 H235 certificate audit
on:
  push:
    branches: [research-work]
    paths:
      - 'src/loto_research/h236_h235_certificate_audit.py'
      - '.github/workflows/h236-h235-certificate-audit.yml'
      - 'data/derived/h235_h234_augmented_exact_shift_rescreen.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: h236-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Independently audit H235 merged certificate
        run: PYTHONPATH=src python -m loto_research.h236_h235_certificate_audit
      - name: Commit compact audited summary
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/derived/h236_h235_certificate_audit_summary.json
          git commit -m "H236 audited H235 certificate summary" || exit 0
          git push origin HEAD:research-work
